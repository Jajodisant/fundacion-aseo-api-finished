<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Punto Crítico de Basura - Fundación, Magdalena</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); padding: 40px 30px; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; font-size: 1.5em; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input, button { width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 12px; font-size: 16px; }
        input:focus, button:focus { outline: none; border-color: #667eea; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; font-weight: 600; transition: background 0.3s; }
        button:hover { background: #45a049; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { padding: 15px; border-radius: 12px; margin-top: 10px; text-align: center; font-weight: 600; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        #ubicacion-group { display: flex; gap: 10px; }
        .coord-input { flex: 1; }
        @media (max-width: 480px) { #ubicacion-group { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 Reportar Punto Crítico de Basura</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">Fundación, Magdalena - Ayúdanos a mantener limpio nuestro municipio</p>
        
        <form id="reporteForm">
            <label for="imagen">📸 Foto del punto crítico (JPG/PNG):</label>
            <input type="file" id="imagen" accept="image/jpeg,image/png" required>

            <label>📱 Ubicación actual</label>
            <div id="ubicacion-group">
                <div>
                    <label for="latitud">Latitud:</label>
                    <input type="number" id="latitud" step="any" placeholder="-90 a 90 (ej: 10.5172)" min="-90" max="90">
                </div>
                <div>
                    <label for="longitud">Longitud:</label>
                    <input type="number" id="longitud" step="any" placeholder="-180 a 180 (ej: -74.1922)" min="-180" max="180">
                </div>
            </div>
            <button type="button" id="getLocation">📍 Obtener mi ubicación</button>

            <button type="submit" id="submitBtn" disabled>🚀 Enviar Reporte</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        const form = document.getElementById('reporteForm');
        const imagenInput = document.getElementById('imagen');
        const latInput = document.getElementById('latitud');
        const lonInput = document.getElementById('longitud');
        const getLocBtn = document.getElementById('getLocation');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');

        let currentPosition = null;

        getLocBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                showStatus('Geolocalización no soportada por este navegador.', 'error');
                return;
            }
            getLocBtn.disabled = true;
            getLocBtn.textContent = '🛰️ Detectando...';
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentPosition = {
                        lat: position.coords.latitude,
                        lon: position.coords.longitude
                    };
                    latInput.value = currentPosition.lat.toFixed(6);
                    lonInput.value = currentPosition.lon.toFixed(6);
                    submitBtn.disabled = false;
                    getLocBtn.textContent = '✅ Ubicación actualizada';
                    setTimeout(() => { getLocBtn.textContent = '📍 Actualizar ubicación'; }, 2000);
                },
                (error) => {
                    let msg = 'Error obteniendo ubicación: ';
                    switch(error.code) {
                        case error.PERMISSION_DENIED: msg += 'Permiso denegado. Habilita en navegador.'; break;
                        case error.POSITION_UNAVAILABLE: msg += 'Ubicación no disponible (sin GPS?). Usa manual.'; break;
                        case 3: msg += 'Timeout. Prueba manual o activa GPS.'; break;
                        default: msg += `Código ${error.code}`;
                    }
                    msg += ' | ¡Puedes ingresar coords manual!';
                    showStatus(msg, 'error');
                },
{ enableHighAccuracy: true, timeout: 30000, maximumAge: 60000 }
            );
            getLocBtn.disabled = false;
        });
        
        // Pre-fill Fundación coords for testing
        if (!latInput.value) latInput.value = '10.5172';
        if (!lonInput.value) lonInput.value = '-74.1922';
        checkFormReady();

        imagenInput.addEventListener('change', checkFormReady);
        latInput.addEventListener('input', checkFormReady);
        lonInput.addEventListener('input', checkFormReady);

        function checkFormReady() {
            const hasImage = imagenInput.files.length > 0;
            const hasCoords = latInput.value && lonInput.value;
            submitBtn.disabled = !(hasImage && hasCoords);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentPosition && (latInput.value == '' || lonInput.value == '')) {
                showStatus('Por favor obtén tu ubicación o ingrésala manualmente.', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('imagen', imagenInput.files[0]);
            formData.append('latitud', currentPosition ? currentPosition.lat : parseFloat(latInput.value));
            formData.append('longitud', currentPosition ? currentPosition.lon : parseFloat(lonInput.value));

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Enviando...';

            try {
                const response = await fetch('/api/reportes', {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || 'Error del servidor');
                }
                const result = await response.json();
                showStatus(`¡Éxito! Su reporte #${result.id} fue registrado y será atendido pronto.`, 'success');
                form.reset();
                currentPosition = null;
                checkFormReady();
            } catch (error) {
                showStatus('Error al enviar: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Enviar Reporte';
            }
        });

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
            if (type === 'success') {
                setTimeout(() => { statusDiv.style.display = 'none'; }, 8000);
            }
        }
    </script>
</body>
</html>
