spring.application.name=fundacion-aseo-api

# Conexion a Supabase
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.[TU_ID_DE_PROJECT].supabase.co:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:[TU_CONTRASENA_DE_SUPABASE]}

# Configuracion de JPA / Hibernate
# En Hibernate 7, PostgreSQLDialect reemplaza al antiguo PostgisPG10Dialect.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto del servidor
server.port=${SERVER_PORT:8080}
