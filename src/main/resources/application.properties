spring.application.name=fundacion-aseo-api

# Conexion a Supabase
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:6543/postgres}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.pool-name=FundacionAseoHikariPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Configuracion de JPA / Hibernate
# En Hibernate 7, PostgreSQLDialect reemplaza al antiguo PostgisPG10Dialect.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Inicializacion espacial de PostgreSQL/PostGIS
spring.sql.init.mode=always

# Puerto del servidor
server.port=${SERVER_PORT:8080}
