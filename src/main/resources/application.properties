spring.application.name=fundacion-aseo-api

# PostgreSQL configurable via env vars (local fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/fundacion_aseo?currentSchema=public}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.hikari.pool-name=FundacionAseoHikariLocalPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Configuracion de JPA / Hibernate
# En Hibernate 7, PostgreSQLDialect reemplaza al antiguo PostgisPG10Dialect.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Inicializacion espacial de PostgreSQL/PostGIS (deshabilitada para evitar init en prod)
spring.sql.init.mode=never

# Multipart config
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Puerto del servidor
server.port=${SERVER_PORT:8080}
